#配置数据员
spring:
  datasource:
    url: jdbc:mysql:///hospital?&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    mongodb:
      uri: mongodb://localhost:27017/hospital_memory_chat
server:
  port: 9527
langchain4j:
  community: #阿里百炼平台引入通义系列模型
    dashscope:
      streaming-chat-model:
        model-name: qwen-plus-latest
        api-key: ${DASH_SCOPE_API_KEY}
#配置mybatisPlus逻辑删除及驼峰命名等信息
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名
  mapper-locations: mapper/**/*Mapper.xml

